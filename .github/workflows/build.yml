name: Build

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_OUTPUT: bin/Release/net8.0-windows/win-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The documented minimum is the .NET 8 SDK, so build with exactly that and not a newer one on the runner.
      - name: Pin the .NET 8 SDK
        shell: pwsh
        run: |
          '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' | Set-Content -LiteralPath global.json
          dotnet --version

      # This one project builds the vendored engine through its project references.
      - name: Build
        run: dotnet build -c Release

      # The app is a WinExe, so the shell does not wait for it unless Start-Process is told to.
      - name: Run tests that need no game data
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE $env:BUILD_OUTPUT
          $exe = Join-Path $folder 'SSE Animation Previewer.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw "Build output not found: $exe" }
          $run = Start-Process -FilePath $exe -ArgumentList '--ci-test' -WorkingDirectory $folder -PassThru
          if (!$run.WaitForExit(600000)) { $run.Kill(); throw '--ci-test did not finish in ten minutes.' }
          if ($run.ExitCode -ne 0) {
            # ci-test.txt is the summary: it names the suite that failed and carries any exception.
            foreach ($log in @(Get-ChildItem -LiteralPath $folder -Filter 'ci-test.txt') + @(Get-ChildItem -LiteralPath $folder -Filter 'error.log') + @(Get-ChildItem -LiteralPath $folder -Filter '*-tests.txt')) {
              Write-Host "::group::$($log.Name)"
              Get-Content -LiteralPath $log.FullName
              Write-Host '::endgroup::'
            }
            throw "--ci-test failed with exit code $($run.ExitCode)."
          }
          Write-Host 'PASS --ci-test'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ env.BUILD_OUTPUT }}/*-tests.txt
            ${{ env.BUILD_OUTPUT }}/ci-test.txt
            ${{ env.BUILD_OUTPUT }}/error.log
          if-no-files-found: warn

      - name: Build the public portable package
        id: package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'pkg\SSE Animation Previewer'
          # A version tag stamps its number into the build.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./scripts/build-portable.ps1 -Public -Output $package -Version $version
          # Tags and branches use their name; pull requests use the short commit hash.
          $label = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:GITHUB_SHA.Substring(0, 7) } else { $env:GITHUB_REF_NAME -replace '[\\/:*?"<>|]', '-' }
          $name = "SSE-Animation-Previewer-$label-win-x64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          # Start the packaged exe once: decoding a DDS goes through the native wrapper, Ijwhost and the C++ runtime.
          $smoke = Start-Process -FilePath (Join-Path $package 'SSE Animation Previewer.exe') -ArgumentList '--texture-dump','Resources\testgrid_d.dds',(Join-Path $env:RUNNER_TEMP 'floor.png') -WorkingDirectory $package -PassThru
          if (!$smoke.WaitForExit(120000)) { $smoke.Kill(); throw 'The packaged exe did not finish.' }
          if ($smoke.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'floor.png'))) { throw "The packaged exe failed to decode a texture (exit $($smoke.ExitCode))." }
          Compress-Archive -Path $package -DestinationPath $zip -Force
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  # Only this job can write to the repository, and it only runs for version tags.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: package

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = (Get-ChildItem -LiteralPath package -Filter *.zip | Select-Object -First 1).FullName
          if (!$zip) { throw 'The package artifact holds no zip.' }
          # A published download is never replaced. To reissue a version, delete its release by hand first.
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          if (@($existing) -contains $env:GITHUB_REF_NAME) { throw "Release $($env:GITHUB_REF_NAME) already exists and will not be overwritten." }
          # Anything but a plain vX.Y.Z tag is a prerelease, which the Nexus job does not send on.
          $kind = @(if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { '--prerelease' })
          gh release create $env:GITHUB_REF_NAME $zip --title "SSE Animation Previewer $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes --notes 'Also on Nexus Mods: https://www.nexusmods.com/skyrimspecialedition/mods/194768' --verify-tag --repo $env:GITHUB_REPOSITORY @kind
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }

  # Sends the new release to the Nexus Mods page. It does nothing until the repository has the key and file ID set.
  nexus:
    needs: release
    uses: ./.github/workflows/nexus.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
